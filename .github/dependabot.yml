version: 2
# The 3-day cooldown mirrors the Viascom minimum release age; it does not delay security updates.
updates:

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 3
    labels:
      - "github-actions"
      - "dependencies"

  # Enable version updates for Gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
      timezone: "Europe/Zurich"
    target-branch: "main"
    cooldown:
      default-days: 3
    labels:
      - "gradle"
      - "dependencies"
