name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: Platform and Kotlin target where it happens.
      placeholder: "JVM 21, iosArm64, JS browser, ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem.
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
